
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Game Deals</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>PC Game Deals</h1>
        <p>Find your next game at a great price.</p>
    </header>

    
<main>
    <section class="controls">
        <input
            type="text"
            id="search-input"
            placeholder="Search for a game..."
        >

        <label>
            <input type="checkbox" id="sale-filter">
            Show sale games only
        </label>
    </section>

    <section id="games-container">
        <!-- Game cards will be added here using JavaScript -->
    </section>
</main>


</body>
</html>
